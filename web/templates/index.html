<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aegis Swarm - Martyr DroneTech Dashboard</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0b1118; color: #e1e7ec; padding: 20px; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #1f2d3d; padding-bottom: 15px; margin-bottom: 20px; }
        h1 { color: #00d2ff; font-size: 1.5rem; }
        .grid-container { display: grid; grid-template-columns: 1fr 1.2fr 1fr; gap: 20px; }
        .card { background: #131c26; border: 1px solid #1f2d3d; border-radius: 8px; padding: 15px; }
        .card h2 { font-size: 1.1rem; color: #58a6ff; margin-bottom: 12px; border-bottom: 1px solid #233446; padding-bottom: 6px; }
        
        /* Node Table */
        .node-row { display: flex; justify-content: space-between; margin-bottom: 10px; padding: 10px; background: #0c141d; border-radius: 6px; }
        .status-badge { padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; }
        .ACTIVE { background: #238636; color: #fff; }
        .MARTYR_FAILING { background: #d29922; color: #fff; }
        .OFFLINE { background: #da3633; color: #fff; }

        /* Coverage Heatmap */
        .map-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; aspect-ratio: 1; }
        .cell { background: #1f2d3d; border-radius: 2px; position: relative; transition: background 0.3s; }
        .cell.covered { background: #0e4429; border: 1px solid #39d353; }
        .drone-marker { position: absolute; inset: 2px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: bold; color: #000; }
        .marker-DRONE-A { background: #00d2ff; }
        .marker-DRONE-B { background: #e3b341; }
        .marker-DRONE-C { background: #a371f7; }
        .marker-DRONE-D { background: #f778ba; }

        /* Logs & Controls */
        .btn-fail { background: #da3633; border: none; color: #fff; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-fail:hover { background: #b62324; }
        .logs-box { background: #060a0e; border-radius: 6px; padding: 10px; font-family: monospace; font-size: 0.85rem; height: 260px; overflow-y: auto; }
        .log-line { margin-bottom: 6px; color: #8b949e; }
    </style>
</head>
<body>
    <header>
        <div>
            <h1>🛡️ Martyr DroneTech / Aegis Swarm Control Deck</h1>
            <p style="font-size: 0.85rem; color: #8b949e;">Autonomous Decentralized Search & Rescue Mesh Simulation</p>
        </div>
        <div style="font-size: 0.9rem; color: #3fb950;">● P2P Mesh Connected</div>
    </header>

    <div class="grid-container">
        <!-- Node Telemetry -->
        <div class="card">
            <h2>Node Status & Telemetry</h2>
            <div id="nodes-container"></div>
        </div>

        <!-- Real-Time Search Matrix -->
        <div class="card">
            <h2>Grid Coverage Matrix (VIO Synced)</h2>
            <div class="map-grid" id="grid-map"></div>
        </div>

        <!-- Failover Controls & Event Logs -->
        <div class="card">
            <h2>Martyr Protocol Logs & Triggers</h2>
            <div style="margin-bottom: 12px;">
                <label style="font-size: 0.85rem; color: #8b949e;">Inject Failure into Node:</label>
                <div style="display: flex; gap: 8px; margin-top: 6px;">
                    <button class="btn-fail" onclick="triggerFailover('DRONE-A')">Kill A</button>
                    <button class="btn-fail" onclick="triggerFailover('DRONE-B')">Kill B</button>
                    <button class="btn-fail" onclick="triggerFailover('DRONE-C')">Kill C</button>
                    <button class="btn-fail" onclick="triggerFailover('DRONE-D')">Kill D</button>
                </div>
            </div>
            <div class="logs-box" id="event-logs"></div>
        </div>
    </div>

    <script>
        const socket = io();

        // Build 10x10 Grid Map
        const mapContainer = document.getElementById('grid-map');
        for (let r = 0; r < 10; r++) {
            for (let c = 0; c < 10; c++) {
                const cell = document.createElement('div');
                cell.id = `cell-${r}-${c}`;
                cell.className = 'cell';
                mapContainer.appendChild(cell);
            }
        }

        socket.on('swarm_update', (data) => {
            // 1. Update Nodes UI
            const nodesContainer = document.getElementById('nodes-container');
            nodesContainer.innerHTML = '';
            
            // Clear existing drone markers from map
            document.querySelectorAll('.drone-marker').forEach(e => e.remove());

            data.nodes.forEach(node => {
                const row = document.createElement('div');
                row.className = 'node-row';
                row.innerHTML = `
                    <div>
                        <strong>${node.node_id}</strong> <small>(${node.pos[0]}, ${node.pos[1]})</small>
                        <div style="font-size:0.8rem; color:#8b949e;">Tasks Left: ${node.remaining_tasks}</div>
                    </div>
                    <div style="text-align:right;">
                        <span class="status-badge ${node.status}">${node.status}</span>
                        <div style="font-size:0.8rem; margin-top:4px;">🔋 ${node.battery}%</div>
                    </div>
                `;
                nodesContainer.appendChild(row);

                // Add marker to map if alive
                if(node.status !== 'OFFLINE') {
                    const targetCell = document.getElementById(`cell-${node.pos[0]}-${node.pos[1]}`);
                    if(targetCell) {
                        const marker = document.createElement('div');
                        marker.className = `drone-marker marker-${node.node_id}`;
                        marker.innerText = node.node_id.replace('DRONE-', '');
                        targetCell.appendChild(marker);
                    }
                }
            });

            // 2. Update Grid Coverage
            for (let r = 0; r < 10; r++) {
                for (let c = 0; c < 10; c++) {
                    const cell = document.getElementById(`cell-${r}-${c}`);
                    if (data.grid[r][c] === 1) {
                        cell.classList.add('covered');
                    }
                }
            }

            // 3. Update Logs
            const logsBox = document.getElementById('event-logs');
            logsBox.innerHTML = '';
            data.logs.forEach(msg => {
                const log = document.createElement('div');
                log.className = 'log-line';
                log.innerText = msg;
                logsBox.appendChild(log);
            });
        });

        function triggerFailover(nodeId) {
            fetch('/api/failover', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ node_id: nodeId })
            });
        }
    </script>
</body>
</html>
